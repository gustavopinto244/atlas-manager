name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"
          cache-dependency-path: power-helper/go.mod

      - name: Check Go formatting
        working-directory: power-helper
        run: test -z "$(gofmt -l .)"

      - name: Run Go vet
        working-directory: power-helper
        run: go vet ./...

      - name: Verify Go modules
        working-directory: power-helper
        run: go mod verify

      - name: Run Go tests
        working-directory: power-helper
        run: go test ./...

      - name: Build Linux power helper
        working-directory: power-helper
        run: mkdir -p ../dist/power-helper && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o ../dist/power-helper/atlas-manager-power-helper ./cmd/atlas-manager-power-helper

      - name: Build deterministic helper compatibility fixture
        working-directory: power-helper
        run: mkdir -p ../dist/power-helper-test && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o ../dist/power-helper-test/atlas-manager-power-helper-fixture ./cmd/atlas-manager-power-helper-fixture

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test
        env:
          ATLAS_MANAGER_POWER_HELPER_FIXTURE: ${{ github.workspace }}/dist/power-helper-test/atlas-manager-power-helper-fixture

      - name: Build production application
        run: npm run build
