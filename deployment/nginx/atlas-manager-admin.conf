# Atlas Manager administrative virtual host.
#
# Reference template. Adapt server_name and certificate handling to the host,
# but keep every marked invariant: each one corresponds to a defect that has
# already occurred or to a boundary the application depends on.
#
# Request path: Cloudflare Access -> Cloudflare Tunnel -> this server block ->
# Atlas Manager on 127.0.0.1:3000.
#
# Validate with `nginx -t` before reloading.

server {
    listen 127.0.0.1:8080;
    server_name admin.gustavopinto.dev.br;

    # The tunnel terminates TLS. Do not expose this block on a public interface.

    server_tokens off;
    client_max_body_size 16k;

    # INVARIANT: never expose the health endpoints publicly. They are
    # unauthenticated by design for local supervision, and /health/server
    # reports host memory, CPU, temperature, load averages and disk usage.
    # Query them over the loopback on the host instead.
    location /health/ {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # INVARIANT: forward the Cloudflare Access assertion explicitly.
        # Nginx drops headers containing underscores by default, and the
        # absence of this line caused the 2026-08-09 authentication loop:
        # Access authenticated the operator, but Atlas never saw the token
        # and answered administrative_authentication_required.
        # See docs/incidents/2026-08-09-cloudflare-access-dashboard-authentication.md
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;

        # INVARIANT: the application validates Host against
        # ADMINISTRATIVE_PUBLIC_ORIGIN and rejects any mismatch with 400. Pass
        # the administrative hostname, not $proxy_host.
        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Proto https;

        # The application runs with `trust proxy` disabled and derives no
        # security decision from forwarded addresses. These are for logging.
        proxy_set_header X-Real-IP $remote_addr;

        # Administrative reads are small and quick; a stuck upstream should
        # surface rather than hang the operator's browser.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffering off;
        proxy_redirect off;
    }
}
